{% extends "base.html" %}
{% block title %}New Post{% endblock %}

{% block content %}
<header class="page-header">
    <h1>Create a New Post</h1>
</header>

<form method="POST" class="post-form">
    <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ title }}" placeholder="Give your post a title" required>
    </div>
    <div class="form-group">
        <label for="author">Author</label>
        <input type="text" id="author" name="author" value="{{ author }}" placeholder="Your name" required>
    </div>
    <div class="form-group">
        <label for="content">Content</label>
        <textarea id="content" name="content" rows="14" placeholder="Write your post here..." required>{{ content }}</textarea>
    </div>
    <div class="form-actions">
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Publish Post</button>
    </div>
</form>
{% endblock %}

{% extends "base.html" %}
{% block title %}Edit Post{% endblock %}

{% block content %}
<header class="page-header">
    <h1>Edit Post</h1>
</header>

<form method="POST" class="post-form">
    <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ post.title }}" required>
    </div>
    <div class="form-group">
        <label for="author">Author</label>
        <input type="text" id="author" name="author" value="{{ post.author }}" required>
    </div>
    <div class="form-group">
        <label for="content">Content</label>
        <textarea id="content" name="content" rows="14" required>{{ post.content }}</textarea>
    </div>
    <div class="form-actions">
        <a href="{{ url_for('view_post', post_id=post.id) }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </div>
</form>
{% endblock %}
